<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Stealth Game AI Simulator</title>
  <link rel="stylesheet" href="/frontend_styles_Version2.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="container">
    <header class="header">
      <h1>Stealth Game AI Simulator</h1>
      <p class="subtitle">Safe A* Pathfinding + Dijkstra</p>
    </header>

    <main class="main-content">
      <div class="controls-panel">
        <div class="toolbar">
          <button id="modeBtn" class="btn primary-btn">
            <span class="icon">🔄</span> Toggle Mode
          </button>
          <button id="pauseBtn" class="btn secondary-btn">
            <span class="icon">⏸️</span> Pause/Resume
          </button>
          <button id="resetBtn" class="btn danger-btn">
            <span class="icon">↩️</span> Reset
          </button>
        </div>
        <div class="status-container">
          Status: <span id="status" class="status-badge">Active</span>
        </div>
      </div>

      <div class="canvas-container">
        <canvas id="gameCanvas" width="600" height="600"></canvas>
      </div>
    </main>

    <footer class="help">
      <div class="help-section">
        <h3>🎮 Controls</h3>
        <p>Use <strong>Arrow Keys</strong> to move the player manually.</p>
      </div>
      <div class="help-section legend">
        <h3>Legend</h3>
        <ul class="legend-list">
          <li><span class="color-box player"></span> Player</li>
          <li><span class="color-box enemy"></span> Enemy</li>
          <li><span class="color-box safe"></span> Safe A* Path</li>
          <li><span class="color-box shortest"></span> Dijkstra Path</li>
          <li><span class="color-box visible"></span> Visible Danger</li>
          <li><span class="color-box near-danger"></span> Near Danger</li>
        </ul>
      </div>
    </footer>
  </div>

  <script src="/app.js"></script>
</body>
</html>
